[workspace]
resolver = "2"
members = [
    "crates/contract",
    "crates/hashed-set",
    "crates/config",
    "crates/core",
    "crates/xray-rpc",
    "crates/xray",
    "crates/node-plugins",
    "crates/asn-lmdb",
    "crates/http",
    "crates/rw-node",
]

[workspace.package]
version = "3.4.3"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/remnawave/node"

[workspace.dependencies]
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crabtables = { version = "0.1", features = ["lang"] }
futures-util = "0.3"
heed = "0.21"
hkdf = "0.13"
http = "1"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "http1", "http2", "tokio"] }
jsonwebtoken = "9"
libc = "0.2"
percent-encoding = "2"
prost = "0.13"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
rmp-serde = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tonic = { version = "0.12", features = ["transport"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-full", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
x509-parser = { version = "0.18", features = ["verify"] }
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
