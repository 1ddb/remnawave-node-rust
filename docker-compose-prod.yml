services:
  remnanode:
    container_name: remnanode
    image: ghcr.io/1ddb/remnawave-node-rust:latest
    network_mode: host
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    env_file:
      - .env
    environment:
      - NODE_PORT=2222
