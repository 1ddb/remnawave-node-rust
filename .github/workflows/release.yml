name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate tag against workspace version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ -z "$manifest_version" ]; then
            echo "cannot read workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$version" != "$manifest_version" ]; then
            echo "tag ${tag} does not match workspace version ${manifest_version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  deb:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: rust:1.100-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake curl debhelper dpkg-dev fakeroot perl unzip zstd
      - name: Set Debian version from tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "rw-node (${VERSION}-1) unstable; urgency=medium"
            echo
            echo "  * Release ${VERSION}."
            echo
            echo " -- Remnawave <support@remnawave.com>  $(LC_ALL=C date -R)"
            echo
            cat debian/changelog
          } > debian/changelog.new
          mv debian/changelog.new debian/changelog
      - name: Build package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          export PATH="/usr/local/cargo/bin:${PATH}"
          dpkg-buildpackage -us -uc -b -d
          mkdir -p dist
          find .. -maxdepth 1 -name "rw-node_${VERSION}-1_*.deb" -exec mv {} dist/ \;
          test -n "$(ls -A dist)"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: [preflight, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.deb dist/SHA256SUMS --clobber

  variants:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.bake.outputs.list }}
    steps:
      - uses: actions/checkout@v7
      - name: Read variants from docker-bake.hcl
        id: bake
        run: |
          list=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')
          echo "list=${list}" >> "$GITHUB_OUTPUT"
          echo "Variants: ${list}"

  docker:
    needs: [preflight, variants]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
        variant: ${{ fromJson(needs.variants.outputs.list) }}
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          pair=${platform//\//-}
          echo "PLATFORM_PAIR=${pair}" >> "$GITHUB_ENV"
          echo "ARCH=${pair#linux-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose GitHub Actions cache
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build and push by digest
        run: |
          set -euo pipefail
          docker buildx bake "${{ matrix.variant }}" \
            --provenance=mode=max \
            --sbom=true \
            --set "*.platform=${{ matrix.platform }}" \
            --set "*.tags=" \
            --set '*.output=type=image,"name=ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true,push=true' \
            --set "*.cache-from=type=gha,scope=docker-${ARCH}" \
            --set "*.cache-to=type=gha,mode=max,scope=docker-${ARCH}" \
            --metadata-file "${{ runner.temp }}/metadata.json"
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest=$(jq -r '.["${{ matrix.variant }}"]["containerimage.digest"]' "${{ runner.temp }}/metadata.json")
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    needs: [preflight, variants, docker]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.list) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create & push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          set -euo pipefail
          resolve() {
            TAG="$1" docker buildx bake --file "$GITHUB_WORKSPACE/docker-bake.hcl" \
              --print "${{ matrix.variant }}" 2>/dev/null \
              | jq -r --arg reg "ghcr.io/${{ github.repository }}:" '.target[].tags[] | select(startswith($reg))'
          }

          refs=()
          for digest in *; do
            refs+=("ghcr.io/${{ github.repository }}@sha256:${digest}")
          done

          major=${VERSION%%.*}
          minor=${VERSION%.*}
          tags=$( {
            resolve "$VERSION"
            if [ "$PRERELEASE" != "true" ]; then
              resolve "$minor"
              resolve "$major"
              resolve latest
            fi
          } | sed 's/^/-t /' | tr '\n' ' ')

          echo "Tags: ${tags}"
          docker buildx imagetools create ${tags} "${refs[@]}"
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}
